version: '3.8'

services:
  # PostgreSQL база данных
  db:
    image: postgres:16-alpine
    container_name: restio-db
    environment:
      POSTGRES_DB: restiodb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - restio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot бэкенд
  backend:
    image: alexandr12/restio-backend:latest
    #build:
     # context: .
     # dockerfile: Dockerfile
    container_name: restio-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/restiodb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - restio-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  restio-network:
    driver: bridge